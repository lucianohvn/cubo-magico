<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cubo.</title>
  <style>
    :root {
      --bg: #f1f0ed;
      --fg: #1e1e1e;
      --line: rgba(0, 0, 0, .28);
      --hint: rgba(0, 0, 0, .42);
      --tint: rgba(110, 155, 235, .17);
      --g1: rgba(255, 255, 255, .55);
      --g2: rgba(255, 255, 255, .16);
      --gedge: rgba(255, 255, 255, .7);
      --gshine: rgba(255, 255, 255, .95);
      --gdrop: rgba(40, 70, 130, .18);
      --gsheen: .55;
      box-sizing: border-box
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #151515;
        --fg: #eeeeec;
        --line: rgba(255, 255, 255, .3);
        --hint: rgba(255, 255, 255, .4);
        --tint: rgba(70, 110, 200, .2);
        --g1: rgba(255, 255, 255, .18);
        --g2: rgba(255, 255, 255, .04);
        --gedge: rgba(255, 255, 255, .2);
        --gshine: rgba(255, 255, 255, .4);
        --gdrop: rgba(0, 0, 0, .45);
        --gsheen: .2
      }
    }

    :root[data-theme="dark"] {
      --bg: #151515;
      --fg: #eeeeec;
      --line: rgba(255, 255, 255, .3);
      --hint: rgba(255, 255, 255, .4);
      --tint: rgba(70, 110, 200, .2);
      --g1: rgba(255, 255, 255, .18);
      --g2: rgba(255, 255, 255, .04);
      --gedge: rgba(255, 255, 255, .2);
      --gshine: rgba(255, 255, 255, .4);
      --gdrop: rgba(0, 0, 0, .45);
      --gsheen: .2
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden
    }

    body {
      background: radial-gradient(130% 95% at 50% 0%, var(--tint), transparent 72%) fixed, var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      display: block
    }

    canvas.hit {
      cursor: pointer
    }

    body {
      transition: color .3s
    }

    .tools {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: 16px;
      display: flex;
      gap: 8px
    }

    .icon {
      height: 40px;
      min-width: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 13px
    }

    .icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    #theme {
      padding: 0;
      width: 40px
    }

    .hint {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 20px);
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: var(--hint);
      pointer-events: none;
      padding: 0 140px;
      box-sizing: border-box
    }

    @media (max-width:640px) {
      .hint {
        top: calc(env(safe-area-inset-top, 0px) + 66px);
        padding: 0 24px
      }
    }

    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
      display: flex;
      justify-content: center;
      gap: 12px
    }

    button {
      position: relative;
      isolation: isolate;
      font: inherit;
      font-size: 14px;
      color: var(--fg);
      background: linear-gradient(135deg, var(--g1), var(--g2));
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--gedge);
      border-radius: 999px;
      padding: 12px 28px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 var(--gshine), inset 0 -1px 1px rgba(255, 255, 255, .2), inset 0 0 14px rgba(255, 255, 255, .12), 0 10px 28px var(--gdrop), 0 1px 3px rgba(0, 0, 0, .08);
      transition: transform .3s cubic-bezier(.3, 1.5, .5, 1), box-shadow .25s, opacity .2s
    }

    button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: radial-gradient(120% 90% at 20% 0%, rgba(255, 255, 255, .6), transparent 55%);
      opacity: var(--gsheen);
      pointer-events: none
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px) scale(1.04);
      box-shadow: inset 0 1px 0 var(--gshine), inset 0 -1px 1px rgba(255, 255, 255, .25), inset 0 0 16px rgba(255, 255, 255, .18), 0 14px 34px var(--gdrop), 0 1px 3px rgba(0, 0, 0, .08)
    }

    button:active:not(:disabled) {
      transform: scale(.96)
    }

    button:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px
    }

    button:disabled {
      opacity: .35;
      cursor: default
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div class="hint">Arraste o fundo para girar. Arraste uma camada para mover.</div>
  <div class="tools">
    <button id="size" class="icon" type="button" aria-label="Trocar o tamanho do cubo"><svg viewBox="0 0 24 24">
        <path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z" />
        <path d="M12 12v9.5M3.5 7.3L12 12l8.5-4.7" />
      </svg><span id="sizeLbl">3×3</span></button>
    <button id="theme" class="icon" type="button"></button>
  </div>
  <div class="bar">
    <button id="scr">Embaralhar</button>
    <button id="sol">Resolver</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      var cv = document.getElementById('c');
      var R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
      R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      var S = new THREE.Scene();
      var cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      S.add(new THREE.AmbientLight(0xffffff, 0.8));
      var dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(4, 7, 6); S.add(dl);

      function resize() { var w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h; cam.position.set(0, 0, Math.max(10.5, 9.2 / cam.aspect)); cam.lookAt(0, 0, 0); cam.updateProjectionMatrix(); }
      addEventListener('resize', resize); resize();

      var root = new THREE.Group(); S.add(root);
      root.quaternion.setFromEuler(new THREE.Euler(0.55, -0.75, 0));
      var pivot = new THREE.Group(); root.add(pivot);

      function rr(w, r) { var s = new THREE.Shape(), h = w / 2; s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.quadraticCurveTo(h, -h, h, -h + r); s.lineTo(h, h - r); s.quadraticCurveTo(h, h, h - r, h); s.lineTo(-h + r, h); s.quadraticCurveTo(-h, h, -h, h - r); s.lineTo(-h, -h + r); s.quadraticCurveTo(-h, -h, -h + r, -h); return new THREE.ShapeGeometry(s); }
      var bodyG = new THREE.BoxGeometry(0.98, 0.98, 0.98), bodyM = new THREE.MeshLambertMaterial({ color: 0x161616 }), stG = rr(0.84, 0.14);
      var faces = [[1, 0, 0, 0xd94a4a], [-1, 0, 0, 0xf28c38], [0, 1, 0, 0xf4f4f0], [0, -1, 0, 0xf2c94c], [0, 0, 1, 0x3fa66b], [0, 0, -1, 0x3f6fd6]];
      var mats = {}; faces.forEach(function (f) { mats[f[3]] = new THREE.MeshLambertMaterial({ color: f[3] }); });
      var cubies = [], Z = new THREE.Vector3(0, 0, 1), N = 3, off = 1;
      function build(n) {
        cubies.forEach(function (c) { root.remove(c); }); cubies = [];
        N = n; off = (n - 1) / 2;
        for (var i = 0; i < n; i++)for (var j = 0; j < n; j++)for (var k = 0; k < n; k++) {
          var x = i - off, y = j - off, z = k - off;
          var g = new THREE.Group(); g.position.set(x, y, z); g.add(new THREE.Mesh(bodyG, bodyM));
          faces.forEach(function (f) {
            if ((f[0] && x === f[0] * off) || (f[1] && y === f[1] * off) || (f[2] && z === f[2] * off)) {
              var nn = new THREE.Vector3(f[0], f[1], f[2]), m = new THREE.Mesh(stG, mats[f[3]]);
              m.position.copy(nn).multiplyScalar(0.495); m.quaternion.setFromUnitVectors(Z, nn); g.add(m);
            }
          });
          root.add(g); cubies.push(g);
        }
      }
      build(3);

      /* ---- movimentos ---- */
      var queue = [], cur = null, hist = [];
      var AX = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
      function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      function push(m, rec) {
        if (rec) {
          var t = hist[hist.length - 1];
          if (t && t.axis === m.axis && t.layer === m.layer && t.dir === -m.dir) hist.pop(); else hist.push({ axis: m.axis, layer: m.layer, dir: m.dir });
        }
        queue.push(m); next();
      }
      function next() {
        if (cur || !queue.length) return;
        var m = queue.shift();
        var list = cubies.filter(function (c) { return Math.round(c.position[m.axis] + off) === m.layer; });
        list.forEach(function (c) { pivot.attach(c); });
        cur = { m: m, list: list, t0: performance.now(), dur: m.dur || (queue.length ? 130 : 280), a: m.dir * Math.PI / 2 };
      }
      function sn(v) { return Math.round(v + off) - off; }
      function finish() {
        pivot.rotation[cur.m.axis] = cur.a; pivot.updateMatrixWorld(true);
        cur.list.forEach(function (c) {
          root.attach(c);
          c.position.set(sn(c.position.x), sn(c.position.y), sn(c.position.z));
          var mt = new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
          mt.elements = mt.elements.map(Math.round); c.quaternion.setFromRotationMatrix(mt);
        });
        pivot.rotation.set(0, 0, 0); cur = null; next();
      }
      var btnS = document.getElementById('scr'), btnR = document.getElementById('sol');
      btnS.onclick = function () {
        if (cur || queue.length) return;
        var ax = ['x', 'y', 'z'], last = null;
        for (var i = 0, cnt = [0, 0, 12, 22, 30][N]; i < cnt; i++) {
          var a; do { a = ax[Math.floor(Math.random() * 3)]; } while (a === last); last = a;
          push({ axis: a, layer: Math.floor(Math.random() * N), dir: Math.random() < .5 ? -1 : 1, dur: 120 }, true);
        }
      };
      btnR.onclick = function () {
        if (cur || queue.length || !hist.length) return;
        var h = hist.slice().reverse(); hist = [];
        h.forEach(function (m) { push({ axis: m.axis, layer: m.layer, dir: -m.dir, dur: h.length > 4 ? 120 : 300 }, false); });
      };

      /* ---- interação ---- */
      var ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), st = null, vel = { x: 0, y: 0 };
      function busy() { return !!cur || queue.length > 0 || !!tr || exploded; }
      function pick(e) {
        ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, cam);
        var h = ray.intersectObjects(cubies, true); return h.length ? h[0] : null;
      }
      function scr(v) { var p = v.clone().project(cam); return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }; }
      function turnFromDrag(hit, dx, dy) {
        var nl = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).applyQuaternion(root.quaternion.clone().invert());
        var ks = ['x', 'y', 'z'], na = ks[0];
        ks.forEach(function (k) { if (Math.abs(nl[k]) > Math.abs(nl[na])) na = k; });
        var n = AX[na].clone().multiplyScalar(nl[na] < 0 ? -1 : 1);
        var s0 = scr(hit.point), best = null, bs = 0, bt = null;
        ks.filter(function (k) { return k !== na; }).forEach(function (k) {
          var w = AX[k].clone().applyQuaternion(root.quaternion), s1 = scr(hit.point.clone().add(w));
          var vx = s1.x - s0.x, vy = s1.y - s0.y, sc = (vx * dx + vy * dy) / Math.hypot(vx, vy);
          if (Math.abs(sc) > Math.abs(bs)) { bs = sc; bt = k; }
        });
        var a = ks.filter(function (k) { return k !== na && k !== bt; })[0];
        var d = AX[bt].clone().multiplyScalar(bs < 0 ? -1 : 1);
        var dir = AX[a].clone().cross(n).dot(d) > 0 ? 1 : -1;
        var layer = Math.round(hit.object.parent.position[a] + off);
        push({ axis: a, layer: layer, dir: dir }, true);
      }
      cv.addEventListener('pointerdown', function (e) {
        cv.setPointerCapture(e.pointerId); vel.x = vel.y = 0;
        var h = busy() ? null : pick(e);
        st = { mode: h ? 'turn' : 'orbit', hit: h, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY };
        cv.style.cursor = 'grabbing';
      });
      cv.addEventListener('pointermove', function (e) {
        if (!st) { var h = busy() ? null : pick(e); cv.classList.toggle('hit', !!h); return; }
        if (st.mode === 'turn') {
          var dx = e.clientX - st.x, dy = e.clientY - st.y;
          if (Math.hypot(dx, dy) > 10) { turnFromDrag(st.hit, dx, dy); st.mode = 'done'; }
        } else if (st.mode === 'orbit') {
          var mx = e.clientX - st.lx, my = e.clientY - st.ly; st.lx = e.clientX; st.ly = e.clientY;
          vel.x = my * 0.006; vel.y = mx * 0.006; spin(vel.x, vel.y);
        }
      });
      function end() { st = null; cv.style.cursor = ''; }
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
      function spin(ax, ay) {
        root.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(AX.y, ay));
        root.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(AX.x, ax));
      }

      /* ---- tema ---- */
      var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      var MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      var mq = matchMedia('(prefers-color-scheme: dark)'), tb = document.getElementById('theme'), de = document.documentElement;
      function isDark() { var t = de.getAttribute('data-theme'); return t ? t === 'dark' : mq.matches; }
      function applyTheme() {
        var d = isDark(); bodyM.color.set(d ? 0x2b2b2b : 0x161616);
        tb.innerHTML = d ? SUN : MOON; tb.setAttribute('aria-label', d ? 'Mudar para modo claro' : 'Mudar para modo escuro');
      }
      tb.onclick = function () { de.setAttribute('data-theme', isDark() ? 'light' : 'dark'); applyTheme(); };
      if (mq.addEventListener) mq.addEventListener('change', applyTheme);
      applyTheme();

      /* ---- tamanho ---- */
      var tr = null, sizeBtn = document.getElementById('size'), sizeLbl = document.getElementById('sizeLbl');
      var exploded = false, pieces = [], expT = 0, lastT = 0, clicks = 0, lastClick = 0;
      sizeBtn.onclick = function () {
        if (busy()) return;
        var t = performance.now(); clicks = (t - lastClick < 600) ? clicks + 1 : 1; lastClick = t;
        if (clicks >= 22) { explode(); return; }
        build(N === 3 ? 2 : N === 2 ? 4 : 3); hist = []; root.scale.setScalar(3 / N); sizeLbl.textContent = N + '×' + N;
      };
      function rv(k) { return new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).multiplyScalar(k); }
      function explode() {
        exploded = true; vel.x = vel.y = 0; cv.style.pointerEvents = 'none';
        var ms = []; cubies.forEach(function (c) { c.children.slice().forEach(function (m) { ms.push(m); }); });
        ms.forEach(function (m) {
          root.attach(m);
          var d = m.position.clone(); if (d.lengthSq() < 1e-4) d = rv(1);
          m.userData.v = d.normalize().multiplyScalar(3 + Math.random() * 7).add(rv(3)).add(new THREE.Vector3(0, 2.5, 0));
          m.userData.w = rv(16); pieces.push(m);
        });
        cubies.forEach(function (c) { root.remove(c); }); cubies = []; hist = []; queue = [];
        document.querySelector('.hint').textContent = 'Rápido demais. Cubos mágicos não gostam disso...';
      }
      /* ---- loop ---- */
      function tick(now) {
        requestAnimationFrame(tick);
        var dt = lastT ? Math.min(.05, (now - lastT) / 1000) : .016; lastT = now;
        if (pieces.length) {
          expT += dt;
          var gr = new THREE.Vector3(0, -14, 0).applyQuaternion(root.quaternion.clone().invert());
          pieces.forEach(function (m) {
            var v = m.userData.v, w = m.userData.w;
            v.addScaledVector(gr, dt); m.position.addScaledVector(v, dt);
            m.rotation.x += w.x * dt; m.rotation.y += w.y * dt; m.rotation.z += w.z * dt;
          });
          if (expT > 3.5) { pieces.forEach(function (m) { root.remove(m); }); pieces = []; }
        }
        if (cur) {
          var p = Math.min(1, (now - cur.t0) / cur.dur);
          if (p >= 1) finish(); else pivot.rotation[cur.m.axis] = cur.a * ease(p);
        }
        if (!st || st.mode !== 'orbit') {
          if (Math.abs(vel.x) + Math.abs(vel.y) > 1e-4) { spin(vel.x, vel.y); vel.x *= .93; vel.y *= .93; }
        }
        var b = busy(); sizeBtn.disabled = b; btnS.disabled = b; btnR.disabled = b || !hist.length;
        R.render(S, cam);
      }
      requestAnimationFrame(tick);
    })();
  </script>
</body>

</html>
