<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cubo.</title>
  <style>
    :root {
      --bg: #f1f0ed;
      --fg: #1e1e1e;
      --line: rgba(0, 0, 0, .28);
      --hint: rgba(0, 0, 0, .42);
      --tint: rgba(110, 155, 235, .17);
      --g1: rgba(255, 255, 255, .55);
      --g2: rgba(255, 255, 255, .16);
      --gedge: rgba(255, 255, 255, .7);
      --gshine: rgba(255, 255, 255, .95);
      --gdrop: rgba(40, 70, 130, .18);
      --gsheen: .55;
      box-sizing: border-box
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #151515;
        --fg: #eeeeec;
        --line: rgba(255, 255, 255, .3);
        --hint: rgba(255, 255, 255, .4);
        --tint: rgba(70, 110, 200, .2);
        --g1: rgba(255, 255, 255, .18);
        --g2: rgba(255, 255, 255, .04);
        --gedge: rgba(255, 255, 255, .2);
        --gshine: rgba(255, 255, 255, .4);
        --gdrop: rgba(0, 0, 0, .45);
        --gsheen: .2
      }
    }

    :root[data-theme="dark"] {
      --bg: #151515;
      --fg: #eeeeec;
      --line: rgba(255, 255, 255, .3);
      --hint: rgba(255, 255, 255, .4);
      --tint: rgba(70, 110, 200, .2);
      --g1: rgba(255, 255, 255, .18);
      --g2: rgba(255, 255, 255, .04);
      --gedge: rgba(255, 255, 255, .2);
      --gshine: rgba(255, 255, 255, .4);
      --gdrop: rgba(0, 0, 0, .45);
      --gsheen: .2
    }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden
    }

    body {
      background: radial-gradient(130% 95% at 50% 0%, var(--tint), transparent 72%) fixed, var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
      display: block
    }

    canvas.hit {
      cursor: pointer
    }

    body {
      transition: color .3s
    }

    .tools {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: 16px;
      display: flex;
      gap: 8px
    }

    .icon {
      height: 40px;
      min-width: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 13px
    }

    .icon svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    #theme {
      padding: 0;
      width: 40px
    }

    .hint {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 20px);
      left: 0;
      right: 0;
      text-align: center;
      font-size: 13px;
      color: var(--hint);
      pointer-events: none;
      padding: 0 140px;
      box-sizing: border-box
    }

    @media (max-width:640px) {
      .hint {
        top: calc(env(safe-area-inset-top, 0px) + 112px);
        padding: 0 24px
      }
    }

    .bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
      display: flex;
      justify-content: center;
      gap: 12px
    }

    button {
      position: relative;
      isolation: isolate;
      font: inherit;
      font-size: 14px;
      color: var(--fg);
      background: linear-gradient(135deg, var(--g1), var(--g2));
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--gedge);
      border-radius: 999px;
      padding: 12px 28px;
      cursor: pointer;
      box-shadow: inset 0 1px 0 var(--gshine), inset 0 -1px 1px rgba(255, 255, 255, .2), inset 0 0 14px rgba(255, 255, 255, .12), 0 10px 28px var(--gdrop), 0 1px 3px rgba(0, 0, 0, .08);
      transition: transform .3s cubic-bezier(.3, 1.5, .5, 1), box-shadow .25s, opacity .2s
    }

    button::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      border-radius: inherit;
      background: radial-gradient(120% 90% at 20% 0%, rgba(255, 255, 255, .6), transparent 55%);
      opacity: var(--gsheen);
      pointer-events: none
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px) scale(1.04);
      box-shadow: inset 0 1px 0 var(--gshine), inset 0 -1px 1px rgba(255, 255, 255, .25), inset 0 0 16px rgba(255, 255, 255, .18), 0 14px 34px var(--gdrop), 0 1px 3px rgba(0, 0, 0, .08)
    }

    button:active:not(:disabled) {
      transform: scale(.96)
    }

    button:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px
    }

    button:disabled {
      opacity: .35;
      cursor: default
    }
    .tools2 {
      position: fixed;
      top: calc(env(safe-area-inset-top, 0px) + 62px);
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px
    }

    #faces {
      padding: 0;
      width: 40px
    }

    .drawer {
      display: grid;
      grid-template-columns: repeat(2, 44px);
      gap: 10px;
      padding: 12px;
      border-radius: 24px;
      background: linear-gradient(135deg, var(--g1), var(--g2));
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--gedge);
      box-shadow: inset 0 1px 0 var(--gshine), 0 10px 28px var(--gdrop);
      opacity: 0;
      visibility: hidden;
      transform: translateX(18px) scale(.96);
      transform-origin: top right;
      transition: opacity .25s, transform .35s cubic-bezier(.3, 1.4, .5, 1), visibility 0s linear .35s
    }

    .drawer.open {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .25s, transform .35s cubic-bezier(.3, 1.4, .5, 1), visibility 0s
    }

    .drawer .face {
      width: 44px;
      height: 44px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .face i {
      display: block;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #888;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .25), inset 0 2px 3px rgba(255, 255, 255, .35)
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>
  <div class="hint">Arraste o fundo para girar. Arraste uma camada para mover.</div>
  <div class="tools">
    <button id="size" class="icon" type="button" aria-label="Trocar o tamanho do cubo"><svg viewBox="0 0 24 24">
        <path d="M12 2.5l8.5 4.8v9.4L12 21.5l-8.5-4.8V7.3z" />
        <path d="M12 12v9.5M3.5 7.3L12 12l8.5-4.7" />
      </svg><span id="sizeLbl">3×3</span></button>
    <button id="theme" class="icon" type="button"></button>
  </div>
  <div class="tools2">
    <button id="faces" class="icon" type="button" aria-label="Ver as faces do cubo" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24">
        <path d="M20 12a8 8 0 1 1-2.6-5.9" />
        <path d="M20 4v4h-4" />
        <rect x="9.5" y="9.5" width="5" height="5" rx="1" />
      </svg></button>
    <div class="drawer" id="drawer">
      <button class="face" type="button" data-c="f4f4f0" aria-label="Mostrar face"><i></i></button>
      <button class="face" type="button" data-c="f2c94c" aria-label="Mostrar face"><i></i></button>
      <button class="face" type="button" data-c="3fa66b" aria-label="Mostrar face"><i></i></button>
      <button class="face" type="button" data-c="3f6fd6" aria-label="Mostrar face"><i></i></button>
      <button class="face" type="button" data-c="f28c38" aria-label="Mostrar face"><i></i></button>
      <button class="face" type="button" data-c="d94a4a" aria-label="Mostrar face"><i></i></button>
    </div>
  </div>
  <div class="bar">
    <button id="scr">Embaralhar</button>
    <button id="sol">Resolver</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      var cv = document.getElementById('c');
      var R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
      R.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      var S = new THREE.Scene();
      var cam = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
      S.add(new THREE.AmbientLight(0xffffff, 0.8));
      var dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(4, 7, 6); S.add(dl);
      var fireLight = new THREE.PointLight(0xff7a2a, 0, 60); fireLight.position.set(0, -0.5, 5); S.add(fireLight);

      var camZ = 10.5, shake = 0, pmat = null;
      function pxScale() { return innerHeight * R.getPixelRatio() / (2 * Math.tan(cam.fov * Math.PI / 360)); }
      function resize() {
        var w = innerWidth, h = innerHeight; R.setSize(w, h, false); cam.aspect = w / h;
        camZ = Math.max(10.5, 9.2 / cam.aspect); cam.position.set(0, 0, camZ); cam.lookAt(0, 0, 0); cam.updateProjectionMatrix();
        if (pmat) pmat.uniforms.uPx.value = pxScale();
      }
      addEventListener('resize', resize); resize();

      var root = new THREE.Group(); S.add(root);
      root.quaternion.setFromEuler(new THREE.Euler(0.55, -0.75, 0));
      var pivot = new THREE.Group(); root.add(pivot);

      /* ---- estado geral ---- */
      var hintEl = document.querySelector('.hint'), HINT = hintEl.textContent;
      var faceBtns = [].slice.call(document.querySelectorAll('#drawer .face'));
      var mode = 'idle'; /* idle | burning | charred | blinking | exploding | gone */
      var boost = 0, burnT = 0, burnClock = 0, blinkT = 0, smolder = 0, warmOn = false;
      var lastMove = 0, lastAct = 0, peak = 0, lightBoost = 0;
      var GAIN = 3, tv = new THREE.Vector3();

      function rr(w, r) { var s = new THREE.Shape(), h = w / 2; s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.quadraticCurveTo(h, -h, h, -h + r); s.lineTo(h, h - r); s.quadraticCurveTo(h, h, h - r, h); s.lineTo(-h + r, h); s.quadraticCurveTo(-h, h, -h, h - r); s.lineTo(-h, -h + r); s.quadraticCurveTo(-h, -h, -h + r, -h); return new THREE.ShapeGeometry(s); }
      var bodyG = new THREE.BoxGeometry(0.98, 0.98, 0.98), bodyM = new THREE.MeshLambertMaterial({ color: 0x161616 }), stG = rr(0.84, 0.14);
      var faces = [[1, 0, 0, 0xd94a4a], [-1, 0, 0, 0xf28c38], [0, 1, 0, 0xf4f4f0], [0, -1, 0, 0xf2c94c], [0, 0, 1, 0x3fa66b], [0, 0, -1, 0x3f6fd6]];
      var mats = {}; faces.forEach(function (f) { mats[f[3]] = new THREE.MeshLambertMaterial({ color: f[3] }); });
      var cubies = [], stk = [], Z = new THREE.Vector3(0, 0, 1), N = 3, off = 1, bs = 1;
      function build(n) {
        cubies.forEach(function (c) { root.remove(c); }); cubies = []; stk = [];
        N = n; off = (n - 1) / 2;
        for (var i = 0; i < n; i++)for (var j = 0; j < n; j++)for (var k = 0; k < n; k++) {
          var x = i - off, y = j - off, z = k - off;
          var g = new THREE.Group(); g.position.set(x, y, z); g.add(new THREE.Mesh(bodyG, bodyM));
          faces.forEach(function (f) {
            if ((f[0] && x === f[0] * off) || (f[1] && y === f[1] * off) || (f[2] && z === f[2] * off)) {
              var nn = new THREE.Vector3(f[0], f[1], f[2]), m = new THREE.Mesh(stG, mats[f[3]].clone());
              m.userData.st = true; m.userData.n = nn.clone(); m.userData.hex = f[3]; m.userData.p = 0;
              m.position.copy(nn).multiplyScalar(0.495); m.quaternion.setFromUnitVectors(Z, nn); g.add(m); stk.push(m);
            }
          });
          root.add(g); cubies.push(g);
        }
      }
      var HEXN = { 0xd94a4a: 'vermelha', 0xf28c38: 'laranja', 0xf4f4f0: 'branca', 0xf2c94c: 'amarela', 0x3fa66b: 'verde', 0x3f6fd6: 'azul' };
      build(3);

      /* ---- movimentos ---- */
      var queue = [], cur = null, hist = [];
      var AX = { x: new THREE.Vector3(1, 0, 0), y: new THREE.Vector3(0, 1, 0), z: new THREE.Vector3(0, 0, 1) };
      function ease(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
      function push(m, rec) {
        if (rec) {
          var t = hist[hist.length - 1];
          if (t && t.axis === m.axis && t.layer === m.layer && t.dir === -m.dir) hist.pop(); else hist.push({ axis: m.axis, layer: m.layer, dir: m.dir });
          peak = Math.max(peak, hist.length);
        }
        queue.push(m); next();
      }
      function next() {
        if (cur || !queue.length) return;
        var m = queue.shift();
        var list = cubies.filter(function (c) { return Math.round(c.position[m.axis] + off) === m.layer; });
        list.forEach(function (c) { pivot.attach(c); });
        cur = { m: m, list: list, t0: performance.now(), dur: m.dur || (queue.length ? 130 : 280), a: m.dir * Math.PI / 2 };
      }
      function sn(v) { return Math.round(v + off) - off; }
      function isSolved() {
        var seen = {}, v = new THREE.Vector3();
        for (var i = 0; i < stk.length; i++) {
          var m = stk[i]; v.copy(m.userData.n).applyQuaternion(m.parent.quaternion);
          var key = Math.round(v.x) + ',' + Math.round(v.y) + ',' + Math.round(v.z);
          if (seen[key] === undefined) seen[key] = m.userData.hex; else if (seen[key] !== m.userData.hex) return false;
        }
        return stk.length > 0;
      }
      function finish() {
        var man = cur.m.manual;
        pivot.rotation[cur.m.axis] = cur.a; pivot.updateMatrixWorld(true);
        cur.list.forEach(function (c) {
          root.attach(c);
          c.position.set(sn(c.position.x), sn(c.position.y), sn(c.position.z));
          var mt = new THREE.Matrix4().makeRotationFromQuaternion(c.quaternion);
          mt.elements = mt.elements.map(Math.round); c.quaternion.setFromRotationMatrix(mt);
        });
        pivot.rotation.set(0, 0, 0); cur = null; next();
        /* resolveu na mão (só movimentos do usuário) -> bomba */
        if (man && !cur && !queue.length && mode === 'idle' && peak >= 3 && isSolved()) startBlink();
      }
      var btnS = document.getElementById('scr'), btnR = document.getElementById('sol');
      btnS.onclick = function () {
        if (busy()) return;
        if (mode === 'charred' || mode === 'gone') { resetState(); build(N); }
        var ax = ['x', 'y', 'z'], last = null;
        for (var i = 0, cnt = [0, 0, 12, 22, 30][N]; i < cnt; i++) {
          var a; do { a = ax[Math.floor(Math.random() * 3)]; } while (a === last); last = a;
          push({ axis: a, layer: Math.floor(Math.random() * N), dir: Math.random() < .5 ? -1 : 1, dur: 120 }, true);
        }
      };
      btnR.onclick = function () {
        if (busy() || mode !== 'idle' || !hist.length) return;
        var h = hist.slice().reverse(); hist = []; peak = 0;
        h.forEach(function (m) { push({ axis: m.axis, layer: m.layer, dir: -m.dir, dur: h.length > 4 ? 120 : 300 }, false); });
      };

      /* ---- interação ---- */
      var ray = new THREE.Raycaster(), ptr = new THREE.Vector2(), st = null, vel = { x: 0, y: 0 };
      function busy() { return !!cur || queue.length > 0 || !!tr || exploded || mode === 'burning' || mode === 'blinking' || mode === 'exploding'; }
      function canTurn() { return !busy() && mode === 'idle'; }
      function pick(e) {
        ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ptr, cam);
        var h = ray.intersectObjects(cubies, true); return h.length ? h[0] : null;
      }
      function scr(v) { var p = v.clone().project(cam); return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight }; }
      function turnFromDrag(hit, dx, dy) {
        var nl = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).applyQuaternion(root.quaternion.clone().invert());
        var ks = ['x', 'y', 'z'], na = ks[0];
        ks.forEach(function (k) { if (Math.abs(nl[k]) > Math.abs(nl[na])) na = k; });
        var n = AX[na].clone().multiplyScalar(nl[na] < 0 ? -1 : 1);
        var s0 = scr(hit.point), best = null, bs2 = 0, bt = null;
        ks.filter(function (k) { return k !== na; }).forEach(function (k) {
          var w = AX[k].clone().applyQuaternion(root.quaternion), s1 = scr(hit.point.clone().add(w));
          var vx = s1.x - s0.x, vy = s1.y - s0.y, sc = (vx * dx + vy * dy) / Math.hypot(vx, vy);
          if (Math.abs(sc) > Math.abs(bs2)) { bs2 = sc; bt = k; }
        });
        var a = ks.filter(function (k) { return k !== na && k !== bt; })[0];
        var d = AX[bt].clone().multiplyScalar(bs2 < 0 ? -1 : 1);
        var dir = AX[a].clone().cross(n).dot(d) > 0 ? 1 : -1;
        var layer = Math.round(hit.object.parent.position[a] + off);
        push({ axis: a, layer: layer, dir: dir, manual: true }, true);
      }
      cv.addEventListener('pointerdown', function (e) {
        cv.setPointerCapture(e.pointerId); vel.x = vel.y = 0;
        var h = canTurn() ? pick(e) : null;
        viewAnim = null;
        st = { mode: h ? 'turn' : 'orbit', hit: h, x: e.clientX, y: e.clientY, lx: e.clientX, ly: e.clientY, lt: performance.now(), spd: 0, dist: 0 };
        cv.style.cursor = 'grabbing';
      });
      cv.addEventListener('pointermove', function (e) {
        if (!st) { var h = canTurn() ? pick(e) : null; cv.classList.toggle('hit', !!h); return; }
        if (st.mode === 'turn') {
          var dx = e.clientX - st.x, dy = e.clientY - st.y;
          if (Math.hypot(dx, dy) > 10) { turnFromDrag(st.hit, dx, dy); st.mode = 'done'; }
        } else if (st.mode === 'orbit') {
          var mx = e.clientX - st.lx, my = e.clientY - st.ly; st.lx = e.clientX; st.ly = e.clientY;
          var tn = performance.now(), inst = Math.hypot(mx, my) / Math.max(4, tn - st.lt) * 1000; st.lt = tn;
          st.spd = st.spd * .6 + inst * .4; /* velocidade do arrasto em px/s */
          var gn = 1 + boost * GAIN;
          vel.x = Math.max(-.6, Math.min(.6, my * 0.006 * gn)); vel.y = Math.max(-.6, Math.min(.6, mx * 0.006 * gn));
          spin(vel.x, vel.y);
          st.dist += Math.hypot(mx, my); lastMove = tn; if (fastRate(st.spd) > 0) lastAct = tn;
        }
      });
      /* só arrastos bem rápidos (acima de ~1100 px/s) aceleram o cubo */
      function fastRate(sp) { return clamp01((sp - 1100) / 1400); }
      function end() {
        /* arrastar e soltar conta como uma ação: cada uma acelera mais o cubo */
        if (st && st.mode === 'orbit' && mode === 'idle' && st.dist >= 24 && performance.now() - lastMove < 120) {
          var rt0 = fastRate(st.spd);
          if (rt0 > 0) { boost = Math.min(1, boost + .35 * rt0); lastAct = performance.now(); }
        }
        st = null; cv.style.cursor = '';
      }
      cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
      function spin(ax, ay) {
        root.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(AX.y, ay));
        root.quaternion.premultiply(new THREE.Quaternion().setFromAxisAngle(AX.x, ax));
      }

      /* ---- tema ---- */
      var SUN = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      var MOON = '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      var mq = matchMedia('(prefers-color-scheme: dark)'), tb = document.getElementById('theme'), de = document.documentElement;
      function isDark() { var t = de.getAttribute('data-theme'); return t ? t === 'dark' : mq.matches; }
      function applyTheme() {
        var d = isDark(); if (mode !== 'burning' && mode !== 'charred') bodyM.color.set(d ? 0x2b2b2b : 0x161616);
        tb.innerHTML = d ? SUN : MOON; tb.setAttribute('aria-label', d ? 'Mudar para modo claro' : 'Mudar para modo escuro');
      }
      tb.onclick = function () { de.setAttribute('data-theme', isDark() ? 'light' : 'dark'); applyTheme(); };
      if (mq.addEventListener) mq.addEventListener('change', applyTheme);
      applyTheme();

      /* ---- gaveta de faces ---- */
      var facesBtn = document.getElementById('faces'), drawer = document.getElementById('drawer');
      facesBtn.onclick = function () {
        var o = !drawer.classList.contains('open'); drawer.classList.toggle('open', o);
        facesBtn.setAttribute('aria-expanded', o ? 'true' : 'false');
      };
      var viewAnim = null, TILT = new THREE.Quaternion().setFromEuler(new THREE.Euler(.35, -.45, 0));
      /* direção (no cubo) da face de determinada cor: centro atual no 3x3, cor de origem nos outros */
      function faceDir(hex) {
        var d = new THREE.Vector3();
        if (N % 2 === 1 && !cur) {
          for (var i = 0; i < stk.length; i++) {
            var m = stk[i]; if (m.userData.hex !== hex) continue;
            var c = m.parent, p = c.position, z = 0;
            ['x', 'y', 'z'].forEach(function (k) { if (Math.round(p[k]) === 0) z++; });
            if (z === 2) { d.copy(m.userData.n).applyQuaternion(c.quaternion); return d.set(Math.round(d.x), Math.round(d.y), Math.round(d.z)); }

      }
      function showFace(hex) {

        var to = TILT.clone().multiply(new THREE.Quaternion().setFromRotationMatrix(mt));

      }
      faceBtns.forEach(function (b) {
        var hx = parseInt(b.dataset.c, 16);

      });

      /* ---- partículas (fogo, fumaça, explosão) ---- */
      var PN = 1100, ppos = new Float32Array(PN * 3), pcol = new Float32Array(PN * 3), psz = new Float32Array(PN), pal = new Float32Array(PN);
      var pv = new Float32Array(PN * 3), page = new Float32Array(PN), plife = new Float32Array(PN), pbase = new Float32Array(PN), ptype = new Uint8Array(PN);

      pgeo.setAttribute('aSize', new THREE.BufferAttribute(psz, 1));

      var pcur = 0, fxLive = false;
      /* tipos: 0 chama, 1 fumaça, 2 brasa, 3 explosão, 4 clarão */

      }

      function clearFx() {

        pgeo.attributes.aSize.needsUpdate = true; pgeo.attributes.aAlpha.needsUpdate = true; fxLive = false;
      }

      /* ---- brilho / aquecimento ---- */
      function setEm(r, g, b) {
        for (var i = 0; i < stk.length; i++) stk[i].material.emissive.setRGB(r, g, b);
        bodyM.emissive.setRGB(r, g, b);
      }
      function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }

      /* ---- fogo e carbonização ---- */
      var CH1 = new THREE.Color(0x24190f), CH2 = new THREE.Color(0x0c0c0c), BK = new THREE.Color(0x040404);
      var BD = new THREE.Color(0x2b2b2b), BL = new THREE.Color(0x161616);
      var ea = { f: 0, s: 0, e: 0 };
      function startBurn() {
        mode = 'burning'; burnClock = 0; burnT = 0; boost = 0; warmOn = false; vel.x = vel.y = 0; ea.f = ea.s = ea.e = 0;
        setEm(0, 0, 0);
        var mn = 1e9, mx = -1e9, ys = stk.map(function (m) { m.getWorldPosition(tv); mn = Math.min(mn, tv.y); mx = Math.max(mx, tv.y); return tv.y; });
        stk.forEach(function (m, i) {
          var hn = (ys[i] - mn) / ((mx - mn) || 1);
          m.userData.d = (1 - hn) * 1.6 + Math.random() * .5; m.userData.p = 0; m.userData.c0 = m.material.color.clone();
        });
      }
      function pickBurning(lo, hi) {
        for (var k = 0; k < 10; k++) { var m = stk[Math.floor(Math.random() * stk.length)], p = m.userData.p; if (p > lo && p < hi) return m; }

        while (ea.f >= 1) {
          ea.f--; m = pickBurning(.03, .92); if (!m) continue; m.getWorldPosition(tv);
          spawn(0, tv.x + (q() - .5) * .35, tv.y + (q() - .5) * .2, tv.z + .1 + q() * .2, (q() - .5) * .6, 1.4 + q() * 1.8, (q() - .5) * .6, .6 + q() * .6, .45 + q() * .4);
        }
        while (ea.s >= 1) {
          ea.s--; m = pickBurning(.25, 1.01); if (!m) continue; m.getWorldPosition(tv);
          spawn(1, tv.x + (q() - .5) * .4, tv.y + .1, tv.z + .1 + q() * .2, (q() - .5) * .5, .9 + q() * .7, (q() - .5) * .5, 1.6 + q() * 1.1, .5 + q() * .4);

        stk.forEach(function (m) { m.userData.p = 1; m.material.color.copy(CH2); m.material.emissive.setRGB(0, 0, 0); });

        hintEl.textContent = 'parabéns você resolveu (?) o cubo!';
      }

      /* ---- bomba ---- */
      function startBlink() {
        mode = 'blinking'; blinkT = 0; boost = 0; burnT = 0; warmOn = false; setEm(0, 0, 0);

      }
      function rdir() {

        for (i = 0; i < 80; i++) { d = rdir(); s = 1 + q() * 4; spawn(1, d.x * .8, d.y * .8, d.z * .8, d.x * s, d.y * s + .8, d.z * s, 1.8 + q() * 1.4, .9 + q() * .8); }
        for (i = 0; i < 90; i++) { d = rdir(); s = 4 + q() * 9; spawn(2, 0, 0, 0, d.x * s, d.y * s + 2, d.z * s, 1.2 + q() * 1.1, .1 + q() * .07); }

      /* ---- tamanho ---- */
      var tr = null, sizeBtn = document.getElementById('size'), sizeLbl = document.getElementById('sizeLbl');
      var exploded = false, pieces = [], expT = 0, expDur = 3.5, lastT = 0, clicks = 0, lastClick = 0;
      function resetState() {

        if (busy()) return;

        ms.forEach(function (m) {

          if (smolder < 3.5) {

            while (ea.s >= 1) {
              ea.s--; var sm = stk[Math.floor(Math.random() * stk.length)]; if (!sm) break; sm.getWorldPosition(tv);
              spawn(1, tv.x + (Math.random() - .5) * .4, tv.y + .1, tv.z + .1, (Math.random() - .5) * .4, .8 + Math.random() * .6, (Math.random() - .5) * .4, 1.6 + Math.random(), .45 + Math.random() * .3);
            }
          }
        }

        /* bomba: pisca 3 vezes e explode */
        if (mode === 'blinking') {
          blinkT += dt;
          var on = blinkT < .24 || (blinkT >= .5 && blinkT < .7) || (blinkT >= .95 && blinkT < 1.1);
          setEm(on ? .9 : 0, on ? .1 : 0, on ? .06 : 0);
          root.scale.setScalar(bs * (on ? 1.045 : 1));

        R.render(S, cam);

    })();
